services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legal_rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_rag"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://legal:legal@db:5432/legal_rag
      CHROMA_DIR: /code/chroma_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
      - chroma:/code/chroma_db

volumes:
  pgdata:
  chroma:
